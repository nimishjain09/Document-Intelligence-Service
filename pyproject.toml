[project]
name = "doc-summarizer"
version = "0.1.0"
description = "Modular async document summarization service"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pydantic-settings>=2.4.0",
    "transformers>=4.44.0,<5.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "streamlit>=1.62.0",
    "sentence-transformers>=5.7.0",
    "faiss-cpu>=1.15.0",
    "ollama>=0.6.2",
]

[project.scripts]
doc-summarizer = "doc_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_summarizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
